<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline Coding Questions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128187;</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <button class="brand" id="homeBtn" title="Problem list">
    <span class="brand-mark">&lt;/&gt;</span>
    <span class="brand-text">Offline Coding Questions</span>
  </button>

  <div class="topbar-center" id="topbarCenter"></div>

  <div class="topbar-right">
    <button class="icon-btn" id="backupsBtn"
      title="Snapshots of your notes and submissions">&#9750;</button>
    <span class="conn-pill" title="This app never touches the network">offline</span>
    <button class="icon-btn" id="themeBtn" title="Toggle theme">&#9789;</button>
  </div>
</header>

<!-- ------------------------------------------------------------- problem list -->
<main id="listView" class="view">
  <div class="list-wrap">
    <h1 class="list-title">Problems</h1>
    <p class="list-sub" id="listStats"></p>
    <div class="list-filters">
      <input type="search" id="listSearch" placeholder="Search problems…" autocomplete="off">
    </div>
    <table class="problem-table">
      <thead>
        <tr>
          <th class="col-status"></th>
          <th class="col-star"></th>
          <th>Problem</th>
          <th class="col-topic">Topic</th>
          <th class="col-diff">Difficulty</th>
        </tr>
      </thead>
      <tbody id="problemRows"></tbody>
    </table>
  </div>
</main>

<!-- ------------------------------------------------------------------ backups -->
<main id="backupsView" class="view hidden">
  <div class="list-wrap">
    <h1 class="list-title">Snapshots</h1>
    <p class="list-sub" id="backupIntro"></p>

    <div class="backup-actions">
      <input type="text" id="backupLabel" maxlength="60"
        placeholder="Label this snapshot (optional) — e.g. before reorganising notes">
      <button class="btn btn-primary" id="createBackup">Save snapshot</button>
      <button class="btn btn-ghost" id="exportNotes">Export notes as .md</button>
    </div>

    <p class="backup-path" id="backupPath"></p>
    <div id="backupList"></div>
  </div>
</main>

<!-- ---------------------------------------------------------- problem workspace -->
<main id="problemView" class="view hidden">
  <div class="split" id="split">

    <!-- left -->
    <section class="pane pane-left" id="paneLeft">
      <nav class="tabs" id="leftTabs">
        <button class="tab active" data-tab="description">Description</button>
        <button class="tab" data-tab="solution">Solution</button>
        <button class="tab" data-tab="notes">Notes<span class="dot" id="notesDot"></span></button>
        <button class="tab" data-tab="submissions">Submissions</button>
      </nav>

      <div class="pane-body">
        <div class="tab-panel active" data-panel="description">
          <div class="prose" id="descriptionBody"></div>
        </div>

        <div class="tab-panel" data-panel="solution">
          <div class="solution-guard" id="solutionGuard">
            <p class="guard-text">Give it an honest attempt first — the editorial walks through every approach.</p>
            <button class="btn btn-ghost" id="revealSolution">Show solution</button>
          </div>
          <div class="prose hidden" id="solutionBody"></div>
        </div>

        <div class="tab-panel notes-panel" data-panel="notes">
          <div class="notes-bar">
            <button class="cheat-toggle" id="cheatToggle"
              aria-expanded="false">&#9656; Markdown cheatsheet</button>
            <span class="save-hint" id="notesSaved">Saved</span>
          </div>

          <div class="cheatsheet hidden" id="cheatsheet"></div>

          <div class="notes-split" id="notesSplit">
            <textarea id="notesInput" class="notes-input" spellcheck="true"
              placeholder="Markdown notes — your pattern, the invariant, what you got wrong&#8230;"></textarea>
            <div class="gutter gutter-h" id="notesGutter" title="Drag to resize"></div>
            <div class="prose notes-preview" id="notesPreview"></div>
          </div>
        </div>

        <div class="tab-panel" data-panel="submissions">
          <div id="submissionsBody"></div>
        </div>
      </div>
    </section>

    <div class="gutter gutter-v" id="gutterV" title="Drag to resize"></div>

    <!-- right -->
    <section class="pane pane-right" id="paneRight">

      <div class="pane editor-pane" id="editorPane">
        <div class="editor-bar">
          <span class="lang-pill">Python 3</span>
          <div class="spacer"></div>
          <span class="save-hint" id="codeSaved"></span>
          <button class="icon-btn" id="resetBtn" title="Reset to starter code">&#8635;</button>
        </div>
        <div class="editor-host" id="editorHost"></div>
      </div>

      <div class="gutter gutter-h" id="gutterH" title="Drag to resize"></div>

      <div class="pane console-pane" id="consolePane">
        <nav class="tabs tabs-sm" id="consoleTabs">
          <button class="tab active" data-console="cases">Test Cases</button>
          <button class="tab" data-console="result">Result<span class="dot" id="resultDot"></span></button>
          <button class="collapse-btn" id="consoleToggle" title="Collapse the console">&#9662;</button>
        </nav>

        <div class="pane-body">
          <div class="tab-panel active" data-panel="cases">
            <div class="cases" id="casesBody"></div>
          </div>
          <div class="tab-panel" data-panel="result">
            <div class="result" id="resultBody">
              <p class="empty">Run your code to see results here.</p>
            </div>
          </div>
        </div>
      </div>

      <div class="action-bar">
        <span class="hint" id="runHint"></span>
        <button class="btn btn-ghost" id="runBtn">Run</button>
        <button class="btn btn-primary" id="submitBtn">Submit</button>
      </div>
    </section>
  </div>
</main>

<div id="toast" class="toast hidden"></div>

<script src="/js/markdown.js"></script>
<script src="/js/highlight.js"></script>
<script src="/js/editor.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
